# DP-FedAvg Configuration
# This configuration file extends the default FL-bench configuration with differential privacy parameters.

# Use the DP-FedAvg method
method: dpfedavg

# Inherit all default configurations
defaults:
  - defaults

# Dataset configuration - start with simple MNIST for testing
dataset:
  name: mnist

# Model configuration - use simple model for DP compatibility
model:
  name: lenet5
  use_torchvision_pretrained_weights: false

# Optimizer configuration - SGD typically works better with DP
optimizer:
  name: sgd
  lr: 0.01

# Common training parameters adjusted for DP
common:
  # Reduced parameters for initial DP testing
  global_epoch: 50
  local_epoch: 5
  batch_size: 64  # Larger batch size often helps with DP utility
  join_ratio: 0.2

  # Enable client-side evaluation to monitor DP impact
  client_side_evaluation: true

  # Testing configuration
  test:
    client:
      interval: 10
      test: true
      train: false
      val: false
    server:
      interval: 5
      test: true
      train: false
      val: false

  # Logging and monitoring
  save_log: true
  save_metrics: true
  save_learning_curve_plot: true
  verbose_gap: 5

# Differential Privacy specific parameters
dpfedavg:
  # Privacy budget parameters
  epsilon: 8.0                    # Privacy budget (smaller = more private)
  delta: 1e-5                     # Privacy parameter (should be < 1/dataset_size)

  # Gradient clipping
  max_grad_norm: 1.0             # Maximum L2 norm for gradient clipping

  # Noise parameters
  noise_multiplier: 30         # If null, will be auto-calculated

  # Sampling parameters
  sample_rate: 0.2              # Poisson sampling rate (0, 1). If negative, calculated from batch_size/dataset_size

  privacy_accountant: "rdp"      # Privacy accounting method: "rdp", "gdp", "prv"

  # Advanced options
  secure_mode: false              # Use cryptographically secure RNG (slower but more secure)
                                  # Set to true for production, false for experiments
  rdp_alpha_max: 64               # Maximum alpha for RDP accountant (larger = tighter bound)
                                  # Increase to 64 or 128 if you see "Optimal order is the largest alpha" warning

# Monitoring configuration - useful for observing DP impact
monitor: tensorboard